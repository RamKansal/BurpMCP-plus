name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # triggers on tags like v1.3.0

permissions:
  contents: write   # needed to create GitHub Releases and upload assets

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release mid-flight

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # ── Java toolchain ────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21

      # ── Gradle ────────────────────────────────────────────────────────────
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          validate-wrappers: true

      # ── Derive version from the git tag (strips leading 'v') ──────────────
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # ── Sync gradle.properties version with the tag ───────────────────────
      - name: Patch version in gradle.properties
        run: |
          sed -i "s/^version=.*/version=${{ steps.version.outputs.VERSION }}/" gradle.properties
          echo "Building version: $(grep '^version=' gradle.properties)"

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build extension JAR
        run: ./gradlew embedProxyJar --no-daemon

      # ── Verify the artifact exists ─────────────────────────────────────────
      - name: Verify JAR was produced
        run: |
          JAR=build/libs/burpmcp-plus.jar
          if [ ! -f "$JAR" ]; then
            echo "ERROR: $JAR not found!" && exit 1
          fi
          echo "JAR size: $(du -sh $JAR | cut -f1)"

      # ── Rename artifact to include version ────────────────────────────────
      - name: Rename JAR with version
        run: |
          cp build/libs/burpmcp-plus.jar \
             build/libs/burpmcp-plus-${{ steps.version.outputs.VERSION }}.jar

      # ── Create GitHub Release ─────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "BurpMCP+ v${{ steps.version.outputs.VERSION }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}  # e.g. v1.4.0-beta → pre-release
          generate_release_notes: true
          files: |
            build/libs/burpmcp-plus-${{ steps.version.outputs.VERSION }}.jar
          body: |
            ## Installation

            1. Download **burpmcp-plus-${{ steps.version.outputs.VERSION }}.jar** below
            2. In Burp Suite → **Extensions** → **Add** → select the JAR
            3. Navigate to the **MCP** tab to configure the server
